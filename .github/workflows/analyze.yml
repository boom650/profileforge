name: Diagnose Analyze

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.4'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Full flutter analyze (log)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Generate localization
        run: flutter gen-l10n --arb-dir=lib/l10n --template-arb-file=app_en.arb --output-localization-file=app_localizations.dart --output-dir=lib/generated/l10n --preferred-supported-locales=en,hi,ta,te,bn,mr,gu,kn,ml,pa || true

      - name: Full analyze -> log
        run: |
          flutter analyze --no-fatal-infos > analyze_full.txt || true
          echo "===== FULL ANALYZE START ====="
          cat analyze_full.txt
          echo "===== FULL ANALYZE END ====="
          echo "TOTAL ERRORS:"; grep -cE "Error:|\berror •" analyze_full.txt || true
