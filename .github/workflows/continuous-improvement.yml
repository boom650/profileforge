name: Continuous Improvement Pipeline (manual only)

# NEUTRALIZED: previously auto-committed to main, conflicting with the improvement loop.
# Now manual-only. No push trigger. No auto-commit. Do not re-enable push.
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if no changes'
        required: false
        default: false

jobs:
  check_triggers:
    name: Check for Triggers
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if pipeline should run
        id: check
        run: |
          SHOULD_RUN="false"
          REASONS=()
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            SHOULD_RUN="true"
            REASONS+=("Forced run requested")
          fi
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          echo "reason=$(IFS='; '; echo "${REASONS[*]}")" >> $GITHUB_OUTPUT

  run_pipeline:
    name: Run Full Improvement Cycle
    needs: check_triggers
    if: needs.check_triggers.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No-op (manual trigger only; improvement loop driven externally)
        run: echo "Continuous improvement is driven by the external autonomous loop, not by this workflow. No auto-commit performed."
