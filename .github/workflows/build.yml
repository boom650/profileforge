name: Build ProfileForge APK

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.4'
  JAVA_VERSION: '17'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Audit Dart dependencies for vulnerabilities
        run: dart pub audit

      - name: Analyze (flutter analyze)
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  build-matrix:
    name: Build (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        channel: [stable]
        include:
          - channel: stable
            flutter-version: '3.44.4'
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.channel }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ matrix.channel }}
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ matrix.channel }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.channel }}
          path: build/app/outputs/bundle/release/*.aab

  build-web:
    name: Build Web
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: flutter build web --release --web-renderer canvaskit

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/**

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-test.txt

      - name: Run backend tests with coverage
        run: |
          cd backend
          pytest -v --cov=. --cov-report=xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-matrix, build-web, backend-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: apk-release-stable
          path: artifacts/apks

      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: aab-stable
          path: artifacts/aab

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/apks/*.apk
            artifacts/aab/*.aab
          generate_release_notes: true

  notify:
    name: Notify
    needs: [build-matrix, build-web, backend-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          if [[ "${{ needs.lint-and-test.result }}" != "success" ]] || \
             [[ "${{ needs.build-matrix.result }}" != "success" ]] || \
             [[ "${{ needs.build-web.result }}" != "success" ]] || \
             [[ "${{ needs.backend-test.result }}" != "success" ]]; then
            echo "Some jobs failed"
            exit 1
          else
            echo "All jobs passed!"
          fi