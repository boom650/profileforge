name: Build ProfileForge APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Serialize: never run two APK builds concurrently (shared runner workspace
# clobbering is a suspected cause of the intermittent lib/main.dart vanish).
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.27.4'
  JAVA_VERSION: '17'

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localization
        run: flutter gen-l10n

      - name: Symlink android/.dart_tool -> ../.dart_tool (gradle-invoked flutter resolves CWD-relative)
        run: |
          rm -rf android/.dart_tool
          ln -sfn ../.dart_tool android/.dart_tool
          ls -la android/.dart_tool

      - name: Capture generated l10n (diagnostic, any location)
        if: always()
        run: |
          echo "=== search for generated app_localizations.dart ==="
          find . -name "app_localizations.dart" -not -path "*/.pub-cache/*" 2>/dev/null
          mkdir -p capture
          cp .dart_tool/flutter_gen/app_localizations.dart capture/from_synthetic.dart 2>/dev/null || true
          cp lib/generated/l10n/app_localizations.dart capture/from_outputdir.dart 2>/dev/null || true
          ls -la capture/ 2>/dev/null
          echo "=== repo_root .dart_tool/flutter_gen exists? ==="
          ls -la .dart_tool/flutter_gen/ 2>/dev/null || echo "NO synthetic at repo root"

      - name: Upload captured l10n
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l10n-generated
          path: capture/
          if-no-files-found: warn

      - name: Guard entrypoint exists
        run: |
          test -f lib/main.dart || (echo "ERROR: lib/main.dart missing before build" && exit 1)

      - name: Build APK (release)
        run: |
          pwd
          ls -la lib/main.dart
          flutter build apk --release

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "ProfileForge APK – ${{ github.ref_name }}"
          body: |
            **Auto-generated release**

            APK (universal)
            AAB (Android App Bundle)

            Build triggered by: ${{ github.actor }}
            Commit: ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: false
          prerelease: true
          make_latest: true

      - name: Run real judge harness (scoring, non-gating)
        if: always()
        run: |
          bash judge/run_judges.sh
