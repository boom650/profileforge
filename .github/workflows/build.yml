name: Build ProfileForge APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.4'
  JAVA_VERSION: '17'

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localization
        run: flutter gen-l10n

      - name: Guard entrypoint exists
        run: |
          test -f lib/main.dart || (echo "ERROR: lib/main.dart missing before build" && exit 1)

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "ProfileForge APK – ${{ github.ref_name }}"
          body: |
            **Auto-generated release**

            APK files (arm64-v8a, armeabi-v7a, x86_64)
            AAB (Android App Bundle)

            Build triggered by: ${{ github.actor }}
            Commit: ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: false
          prerelease: true
          make_latest: true

      - name: Run real judge harness (scoring, non-gating)
        if: always()
        run: |
          bash judge/run_judges.sh
          echo "=== JUDGE RESULTS ==="
          cat judge/results.json
