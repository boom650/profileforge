name: Build, Test & Release ProfileForge

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.0'
  JAVA_VERSION: '17'

jobs:
  quality-gate:
    name: Analyze + Test + Golden + Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Disable analytics
        run: flutter config --no-analytics --no-cli-animations

      - name: Regenerate Android (canonical)
        run: |
          rm -rf android
          flutter create --platforms android .
          rm -f test/widget_test.dart

      - name: Inject runtime permissions (INTERNET for connectivity/dio)
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$MAN" || \
            sed -i 's#</manifest>#  <uses-permission android:name="android.permission.INTERNET"/>\n</manifest>#' "$MAN"

      - name: Pub get
        run: flutter pub get

      - name: Generate code (freezed + drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (GATE)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit + Widget tests (GATE)
        run: flutter test

      - name: Golden tests
        run: |
          if [ -d test/golden ]; then flutter test test/golden; else echo "no golden tests yet"; fi

      - name: Integration tests
        run: |
          if [ -d integration_test ]; then flutter test integration_test; else echo "no integration tests yet"; fi

  build-release:
    name: Build & Release APK/AAB
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Disable analytics
        run: flutter config --no-analytics --no-cli-animations

      - name: Regenerate Android (canonical)
        run: |
          rm -rf android
          flutter create --platforms android .
          rm -f test/widget_test.dart

      - name: Inject runtime permissions (INTERNET for connectivity/dio)
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$MAN" || \
            sed -i 's#</manifest>#  <uses-permission android:name="android.permission.INTERNET"/>\n</manifest>#' "$MAN"

      - name: Pub get
        run: flutter pub get

      - name: Generate code (freezed + drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release, split-per-abi)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          gh release create "$TAG" \
            --title "ProfileForge APK – ${{ github.ref_name }}" \
            --notes "Auto-release. arm64-v8a / armeabi-v7a / x86_64 APK + AAB. Triggered by ${{ github.actor }} @ ${{ github.sha }}" \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk \
            build/app/outputs/bundle/release/app-release.aab
