name: Build ProfileForge APK

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.4'
  JAVA_VERSION: '17'

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Disable Flutter analytics
        run: flutter config --no-analytics --no-cli-animations

      - name: Regenerate Android project (canonical Flutter 3.27.4)
        run: |
          rm -rf android
          flutter create --platforms android .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "v${{ github.run_number }}-${{ github.sha }}"
          name: "ProfileForge APK – ${{ github.ref_name }}"
          body: |
            **Auto-generated release**

            📱 APK files (arm64-v8a, armeabi-v7a, x86_64)
            📦 AAB (Android App Bundle)

            Build triggered by: ${{ github.actor }}
            Commit: ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false
          generate_release_notes: false
          prerelease: true
