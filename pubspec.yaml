name: profileforge
description: "AI CV Builder - Gamified college admissions profile builder for Indian 11th graders"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Local database & caching
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Networking
  dio: ^5.4.3+1
  http: ^1.2.2
  url_launcher: ^6.3.1
  
  # Connectivity
  connectivity_plus: ^6.0.3

  # Routing
  go_router: ^14.2.0
  
  # Location & Maps
  geolocator: ^11.1.0
  latlong2: ^0.9.1
  flutter_map: ^7.0.2
  
  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  
  # Google Services
  google_places_flutter: ^2.0.5
  google_maps_flutter: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  
  # Security & Encryption
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  collection: ^1.18.0
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - lib/assets/images/skins/